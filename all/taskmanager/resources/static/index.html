<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>QB Task Manager</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/style.css?v=4" rel="stylesheet">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────── -->
<header class="app-header">
    <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
            <h1>QB Task Manager</h1>
            <span class="brand-sub">Actor · HTTP · WebSocket · PostgreSQL · Redis</span>
        </div>
    </div>
    <div class="header-controls">
        <div class="status-cluster">
            <div class="ws-badge" id="ws-badge">
                <span class="ws-dot"></span>
                <span class="ws-label">WS</span>
            </div>
            <span class="cache-badge hidden" id="cache-badge"></span>
            <span class="total-count" id="total-count">0 tasks</span>
        </div>
        <button class="btn-primary" id="new-task-btn">
            <svg fill="currentColor" height="14" viewBox="0 0 14 14" width="14">
                <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
            </svg>
            New Task
        </button>
    </div>
</header>

<!-- ── Main layout ──────────────────────────────────────────────────── -->
<div class="app-layout">

    <!-- Kanban Board -->
    <main class="kanban-board" id="kanban-board">

        <!-- Pending -->
        <div class="column" data-status="pending">
            <div class="column-header">
                <span class="col-dot pending"></span>
                <span class="col-title">Pending</span>
                <span class="col-count" id="count-pending">0</span>
            </div>
            <div class="drop-zone" data-status="pending" id="zone-pending">
                <div class="empty-hint">No pending tasks</div>
            </div>
        </div>

        <!-- In Progress -->
        <div class="column" data-status="in_progress">
            <div class="column-header">
                <span class="col-dot in_progress"></span>
                <span class="col-title">In Progress</span>
                <span class="col-count" id="count-in_progress">0</span>
            </div>
            <div class="drop-zone" data-status="in_progress" id="zone-in_progress">
                <div class="empty-hint">Drag tasks here to start</div>
            </div>
        </div>

        <!-- Completed -->
        <div class="column" data-status="completed">
            <div class="column-header">
                <span class="col-dot completed"></span>
                <span class="col-title">Completed</span>
                <span class="col-count" id="count-completed">0</span>
            </div>
            <div class="drop-zone" data-status="completed" id="zone-completed">
                <div class="empty-hint">Completed tasks appear here</div>
            </div>
        </div>

    </main>

    <!-- Live Activity Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-head">
            <div class="sidebar-title">
                <span class="live-dot"></span>
                Live Activity
            </div>
            <button class="btn-ghost" id="clear-events-btn">Clear</button>
        </div>
        <div class="events-log" id="events-log"></div>
    </aside>

</div>

<!-- ── New Task Drawer ──────────────────────────────────────────────── -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div aria-label="New Task" class="drawer" id="drawer" role="dialog">
    <div class="drawer-header">
        <h2>New Task</h2>
        <button aria-label="Close" class="btn-icon-close" id="btn-close-drawer">✕</button>
    </div>
    <div class="drawer-body">
        <form id="task-form" novalidate>
            <div class="field">
                <label for="task-title">Title</label>
                <input autocomplete="off" id="task-title" placeholder="What needs to be done?" required type="text">
            </div>
            <div class="field">
                <label for="task-desc">Description <span class="optional">(optional)</span></label>
                <textarea id="task-desc" placeholder="Add more details…" rows="3"></textarea>
            </div>
            <div class="field">
                <label>Initial Status</label>
                <div class="status-picker">
                    <button class="status-chip selected" data-value="pending" type="button">📋 Pending</button>
                    <button class="status-chip" data-value="in_progress" type="button">⚡ In Progress</button>
                    <button class="status-chip" data-value="completed" type="button">✅ Done</button>
                </div>
            </div>
            <button class="btn-primary btn-full" id="btn-submit" type="submit">Create Task</button>
        </form>
    </div>
</div>

<!-- ── Toast container ──────────────────────────────────────────────── -->
<div class="toast-container" id="toast-container"></div>

<script src="/static/app.js?v=4"></script>
</body>
</html>
